name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default; nothing in this workflow needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest -v --cov

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

  # Single aggregate check for branch protection to require. Gating on this rather
  # than on individual matrix jobs means the matrix can change without anyone having
  # to remember to update the protection rule.
  tests-passed:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream job results: ${results}"
          if [ -z "${results}" ]; then
            echo "::error::no upstream job results; refusing to pass vacuously"
            exit 1
          fi
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job reported '${result}'"
              exit 1
            fi
          done
