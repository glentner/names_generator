name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Verify the release tag matches the package version
        run: |
          name="$(basename dist/*.tar.gz .tar.gz)"
          version="${name#names_generator-}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::release tag '${tag}' does not match package version '${version}'"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    # Gated on the 'pypi' environment; add required reviewers under
    # Settings -> Environments -> pypi so a release cannot publish unattended.
    environment:
      name: pypi
      url: https://pypi.org/project/names_generator/
    permissions:
      # Mints the short-lived OIDC token for PyPI Trusted Publishing.
      # No long-lived API token is stored in this repository.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
